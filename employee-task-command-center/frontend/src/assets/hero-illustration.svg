<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="800" fill="#0c0c0c"/>

  <!-- big hand-drawn open loop -->
  <path d="M 305 215
           C 360 110, 560 55, 690 95
           C 760 118, 790 170, 800 230
           C 815 300, 800 380, 760 430
           C 715 487, 640 470, 590 460
           C 510 444, 430 470, 375 525
           C 330 570, 300 620, 320 655
           C 350 690, 470 670, 560 645
           C 640 622, 700 590, 745 530"
        stroke="#f4f1ea" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- orange accent circle -->
  <circle cx="755" cy="195" r="78" fill="#f0822f"/>

  <!-- avatar circle, top left -->
  <circle cx="183" cy="160" r="52" stroke="#f4f1ea" stroke-width="9" fill="none"/>
  <circle cx="183" cy="148" r="13" fill="#f0822f"/>
  <path d="M 162 178 C 162 162, 204 162, 204 178" stroke="#f4f1ea" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- connector from avatar down into the panel -->
  <path d="M 183 212 L 183 305 L 350 305" stroke="#f4f1ea" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- main rounded panel -->
  <rect x="350" y="240" width="390" height="245" rx="22" stroke="#f4f1ea" stroke-width="9" fill="none"/>

  <!-- slider rows inside panel -->
  <line x1="392" y1="312" x2="655" y2="312" stroke="#f4f1ea" stroke-width="6"/>
  <circle cx="667" cy="312" r="16" stroke="#f4f1ea" stroke-width="7" fill="none"/>

  <line x1="392" y1="356" x2="600" y2="356" stroke="#f4f1ea" stroke-width="6"/>
  <circle cx="612" cy="356" r="16" stroke="#f4f1ea" stroke-width="7" fill="none"/>

  <line x1="392" y1="400" x2="565" y2="400" stroke="#f4f1ea" stroke-width="6"/>
  <circle cx="577" cy="400" r="16" stroke="#f4f1ea" stroke-width="7" fill="none"/>

  <!-- connector from panel to small card, bottom right -->
  <path d="M 740 410 L 880 410 L 880 470 L 905 470" stroke="#f4f1ea" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- small card -->
  <rect x="855" y="505" width="120" height="100" rx="18" stroke="#f4f1ea" stroke-width="9" fill="none"/>
  <line x1="885" y1="540" x2="945" y2="540" stroke="#f0822f" stroke-width="4"/>
  <line x1="885" y1="565" x2="945" y2="565" stroke="#f0822f" stroke-width="4"/>
</svg>
